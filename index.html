<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CyberDodge Online - Arena Multijugador</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Firebase App & Firestore SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- PANTALLA DE LOGIN -->
  <div id="loginScreen" class="overlay">
    <div class="card">
      <h1 class="title">CYBERDODGE</h1>
      <p class="subtitle">Arena Global Multijugador</p>
      
      <div class="form-group">
        <label for="usernameInput">Tu Nickname de Piloto</label>
        <input type="text" id="usernameInput" maxlength="12" placeholder="Ej: CyberAce" autofocus>
      </div>

      <button id="btnPlay" class="btn-primary">ENTRAR A LA ARENA</button>
    </div>
  </div>

  <!-- PANTALLA DEL JUEGO -->
  <div id="gameScreen" class="hidden">
    <div class="header">
      <div class="player-info">
        Piloto: <span id="displayName">--</span>
      </div>
      <div class="stats">
        <span>Puntos: <strong id="scoreVal">0</strong></span>
        <span>Velocidad: <strong id="speedVal">x1.0</strong></span>
      </div>
    </div>

    <div class="main-layout">
      <div class="canvas-container">
        <canvas id="gameCanvas" width="600" height="400"></canvas>
      </div>

      <div class="sidebar">
        <h3>RECORDS HISTÓRICOS</h3>
        <ol id="leaderboardList">
          <li>Cargando top 10...</li>
        </ol>
      </div>
    </div>

    <div class="controls-hint">
      Móvete con <b>WASD</b> | Presiona <b>R</b> para reiniciar si caes
    </div>
  </div>

  <!-- Configuración e inicio del juego -->
  <script src="js/config.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
